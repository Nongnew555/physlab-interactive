              const px = tx + tw + 4 + s * reachPx;
              const py = hy + s * s * (groundY - hy);
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // Moving droplets
            ctx.fillStyle = '#ffffff';
            const dFrac = (phase * 0.08 + ho.frac) % 1;
            const dpx = tx + tw + 4 + dFrac * reachPx;
            const dpy = hy + dFrac * dFrac * (groundY - hy);
            ctx.beginPath(); ctx.arc(dpx, dpy, 3, 0, Math.PI * 2); ctx.fill();
          }
        });

        ctx.fillStyle = '#e2e8f0'; ctx.font = '600 13px "Prompt"';
        ctx.fillText(`ของเหลว: ${liq.name} — ยิ่งลึก ความดัน P = ρgh ยิ่งสูง!`, 20, 26);

        setReadouts(ui.readouts, [
          { label: 'ความดันรูบน', value: `${(pressures[0].P / 1000).toFixed(1)} kPa`, color: '#38bdf8' },
          { label: 'ความดันรูกลาง', value: `${(pressures[1].P / 1000).toFixed(1)} kPa`, color: '#34d399' },
          { label: 'ความดันรูล่างสุด', value: `${(pressures[2].P / 1000).toFixed(1)} kPa`, color: '#fbbf24' },
          { label: 'ความหนาแน่น ρ', value: `${liq.rho} kg/m³`, color: '#a78bfa' }
        ]);
      } else {
        // Hydraulic Lift
        animPress += (hyd.press - animPress) * 0.08;
        const A1 = 0.05; // m²
        const A2 = A1 * hyd.ratio;
        const P = hyd.f1 / A1;
        const F2 = hyd.f1 * hyd.ratio;

        const baseY = h - 42;
        const leftX = w * 0.22, rightX = w * 0.62;
        const w1 = 44, w2 = Math.min(180, 68 + hyd.ratio * 2.2);
        const drop1 = animPress * 58;
        const lift2 = animPress * (58 / Math.sqrt(hyd.ratio)) * 1.4;

        // Fluid U-chamber
        ctx.fillStyle = 'rgba(56, 189, 248, 0.55)';
        ctx.beginPath();
        ctx.rect(leftX, 150 + drop1, w1, baseY - (150 + drop1));
        ctx.rect(leftX, baseY - 46, rightX - leftX + w2, 46);
        ctx.rect(rightX, 180 - lift2, w2, baseY - (180 - lift2));
        ctx.fill();

        // Walls
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
        ctx.strokeRect(leftX, 110, w1, baseY - 110);
        ctx.strokeRect(rightX, 110, w2, baseY - 110);

        // Small piston
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(leftX + 2, 140 + drop1, w1 - 4, 14);
        drawArrow(ctx, leftX + w1 / 2, 95 + drop1, leftX + w1 / 2, 138 + drop1, '#fbbf24', 3, `f₁=${hyd.f1}N`, { x: -42, y: 0 });

        // Big piston + Car load
        const p2y = 170 - lift2;
        ctx.fillStyle = '#34d399';
        ctx.fillRect(rightX + 2, p2y, w2 - 4, 16);
        // Car silhouette on big piston
        ctx.fillStyle = '#fb7185';
        ctx.beginPath(); ctx.roundRect(rightX + w2 * 0.15, p2y - 34, w2 * 0.7, 26, 7); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px "JetBrains Mono"'; ctx.textAlign = 'center';
        ctx.fillText(`F₂ = ${F2} N`, rightX + w2 / 2, p2y - 16);
        ctx.textAlign = 'left';

        ctx.fillStyle = '#e2e8f0'; ctx.font = '600 13px "Prompt"';
        ctx.fillText(`กฎของปาสคาล: ความดัน P = ${(P / 1000).toFixed(2)} kPa ส่งผ่านของเหลวเท่ากันทุกจุด!`, 20, 26);

        setReadouts(ui.readouts, [
          { label: 'แรงกดลูกสูบเล็ก (f₁)', value: `${hyd.f1} N`, color: '#fbbf24' },
          { label: 'แรงยกลูกสูบใหญ่ (F₂)', value: `${F2.toLocaleString()} N`, color: '#34d399' },
          { label: 'ความดันในน้ำมัน (P)', value: `${(P / 1000).toFixed(2)} kPa`, color: '#38bdf8' },
          { label: 'ตัวคูณแรง (A₂ / A₁)', value: `${hyd.ratio} เท่า`, color: '#a78bfa' }
        ]);
      }

      rafId = requestAnimationFrame(render);
    }
    rafId = requestAnimationFrame(render);
  }

  /* ================= SIM 8: KINETIC GAS & MECHANICAL WAVES ================= */
  function initThermalWave(ui) {
    let mode = 'gas';
    const gas = { tempK: 300, volPct: 100, particles: [] };
    const wave = { type: 'transverse', amp: 46, freq: 1.5, speed: 140, phase: 0 };

    for (let i = 0; i < 42; i++) {
      const ang = Math.random() * Math.PI * 2;
      gas.particles.push({
        x: Math.random(), y: Math.random(),
        vx: Math.cos(ang), vy: Math.sin(ang)
      });
    }

    ui.modes.innerHTML = `
      <button class="mode-btn active" data-m="gas">🔥 ทฤษฎีจลน์ก๊าซ (กฎบอยล์ & อุณหภูมิ)</button>
      <button class="mode-btn" data-m="wave">🌊 เครื่องกำเนิดคลื่นกล (v = fλ)</button>
    `;

    function buildUI() {
      ui.controls.innerHTML = '';
      if (mode === 'gas') {
        ui.controls.append(
          makeSlider('gt', 'อุณหภูมิสัมบูรณ์ T', 100, 900, 25, gas.tempK, 'K', v => gas.tempK = v),
          makeSlider('gv', 'ปริมาตรกระบอกสูบ V', 35, 100, 5, gas.volPct, '%', v => gas.volPct = v)
        );
        ui.actions.innerHTML = `<span class="meta-tag">สังเกต: T (°C) = T(K) − 273 | ลด V ครึ่งหนึ่ง → P เพิ่ม 2 เท่า!</span>`;
      } else {
        ui.controls.append(
          makeSlider('wa', 'แอมพลิจูด A', 15, 75, 5, wave.amp, 'px', v => wave.amp = v),
          makeSlider('wf', 'ความถี่ f', 0.5, 4.0, 0.25, wave.freq, 'Hz', v => wave.freq = v),
          makeSlider('wv', 'อัตราเร็วคลื่น v', 80, 260, 20, wave.speed, 'px/s', v => wave.speed = v)
        );
        ui.actions.innerHTML = `
          <button class="btn btn-sm ${wave.type === 'transverse' ? 'btn-primary' : ''}" id="btn-wt">〰️ คลื่นตามขวาง (Transverse)</button>
          <button class="btn btn-sm ${wave.type === 'longitudinal' ? 'btn-primary' : ''}" id="btn-wl">🔊 คลื่นตามยาว (Longitudinal)</button>
        `;
        ui.actions.querySelector('#btn-wt').onclick = () => { wave.type = 'transverse'; buildUI(); };
        ui.actions.querySelector('#btn-wl').onclick = () => { wave.type = 'longitudinal'; buildUI(); };
      }
    }

    ui.modes.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        ui.modes.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.m;
        buildUI();
      });
    });
    buildUI();

    let last = performance.now();
    function render(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const { ctx, w, h } = setupCanvas(ui.canvas);
      ctx.fillStyle = '#090e1a';
      ctx.fillRect(0, 0, w, h);
      drawGrid(ctx, w, h, 30);

      if (mode === 'gas') {
        const boxX = 54, boxY = 58, maxBoxW = w - 130, boxH = h - 104;
        const curW = maxBoxW * (gas.volPct / 100);
        const speedFactor = Math.sqrt(gas.tempK / 300) * 1.1;

        // Cylinder chamber
        ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
        ctx.fillRect(boxX, boxY, curW, boxH);
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
        ctx.strokeRect(boxX, boxY, maxBoxW, boxH);

        // Movable piston
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(boxX + curW, boxY + 2, 16, boxH - 4);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(boxX + curW + 16, boxY + boxH / 2 - 8, w - (boxX + curW + 24), 16);

        // Particle color by temperature
        const pCol = gas.tempK < 250 ? '#38bdf8' : (gas.tempK < 550 ? '#34d399' : '#fb7185');

        gas.particles.forEach(p => {
          p.x += p.vx * dt * speedFactor * 0.45;
          p.y += p.vy * dt * speedFactor * 0.45;
          if (p.x < 0.02) { p.x = 0.02; p.vx = Math.abs(p.vx); }
          if (p.x > 0.98) { p.x = 0.98; p.vx = -Math.abs(p.vx); }
          if (p.y < 0.03) { p.y = 0.03; p.vy = Math.abs(p.vy); }
          if (p.y > 0.97) { p.y = 0.97; p.vy = -Math.abs(p.vy); }

          const px = boxX + 8 + p.x * (curW - 16);
          const py = boxY + 8 + p.y * (boxH - 16);
          ctx.fillStyle = pCol;
          ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
        });

        const pressureAtm = (gas.tempK / 300) * (100 / gas.volPct);
        const tempC = gas.tempK - 273;

        ctx.fillStyle = '#e2e8f0'; ctx.font = '600 13px "Prompt"';
        ctx.fillText(`กฎรวมก๊าซ PV/T = คงที่ — โมเลกุลชนผนังถี่และแรงขึ้นเมื่อลด V หรือเพิ่ม T`, 20, 30);

        setReadouts(ui.readouts, [
          { label: 'ความดันก๊าซ P', value: `${pressureAtm.toFixed(2)} atm`, color: '#fbbf24' },
          { label: 'อุณหภูมิ (K / °C)', value: `${gas.tempK} K (${tempC}°C)`, color: pCol },
          { label: 'ปริมาตร V', value: `${gas.volPct} %`, color: '#38bdf8' },
          { label: 'ค่าคงที่ PV / T', value: `${((pressureAtm * gas.volPct) / gas.tempK).toFixed(3)}`, color: '#34d399' }
        ]);
      } else {
        // Mechanical Wave
        wave.phase += 2 * Math.PI * wave.freq * dt;
        const lambda = wave.speed / wave.freq;
        const k = (2 * Math.PI) / lambda;
        const midY = h * 0.54;

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(20, midY); ctx.lineTo(w - 20, midY); ctx.stroke();
        ctx.setLineDash([]);

        if (wave.type === 'transverse') {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let x = 24; x <= w - 24; x += 3) {
            const y = midY - wave.amp * Math.sin(k * (x - 24) - wave.phase);
            if (x === 24) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Particles on rope
          for (let x = 40; x <= w - 40; x += 24) {
            const y = midY - wave.amp * Math.sin(k * (x - 24) - wave.phase);
            const isTracer = Math.abs(x - w * 0.45) < 13;
            ctx.fillStyle = isTracer ? '#fb7185' : '#93c5fd';
            ctx.beginPath(); ctx.arc(x, y, isTracer ? 8 : 4, 0, Math.PI * 2); ctx.fill();
            if (isTracer) {
              ctx.strokeStyle = 'rgba(251, 113, 133, 0.4)';
              ctx.beginPath(); ctx.moveTo(x, midY - wave.amp - 10); ctx.lineTo(x, midY + wave.amp + 10); ctx.stroke();
            }
          }
        } else {
          // Longitudinal wave (sound / slinky dots)
          const rows = 5;
          for (let r = 0; r < rows; r++) {
            const py = midY - 60 + r * 30;
            for (let x0 = 40; x0 <= w - 40; x0 += 18) {
              const disp = (wave.amp * 0.32) * Math.sin(k * (x0 - 24) - wave.phase);
              const isTracer = r === 2 && Math.abs(x0 - w * 0.45) < 10;
              ctx.fillStyle = isTracer ? '#fb7185' : '#38bdf8';
              ctx.beginPath(); ctx.arc(x0 + disp, py, isTracer ? 7 : 3.5, 0, Math.PI * 2); ctx.fill();
            }
          }
        }

        ctx.fillStyle = '#e2e8f0'; ctx.font = '600 13px "Prompt"';
        ctx.fillText('🔴 จ้องที่จุดสีแดง: ตัวกลางแค่สั่นกลับไปกลับมา ไม่ได้เดินทางไปกับคลื่น!', 20, 30);

        setReadouts(ui.readouts, [
          { label: 'อัตราเร็วคลื่น (v)', value: `${wave.speed} px/s`, color: '#38bdf8' },
          { label: 'ความถี่ (f)', value: `${wave.freq.toFixed(2)} Hz`, color: '#34d399' },
          { label: 'ความยาวคลื่น λ = v/f', value: `${lambda.toFixed(1)} px`, color: '#fbbf24' },
          { label: 'คาบเวลา T = 1/f', value: `${(1 / wave.freq).toFixed(2)} s`, color: '#a78bfa' }
        ]);
      }

      rafId = requestAnimationFrame(render);
    }
    rafId = requestAnimationFrame(render);
  }

  const registry = {
    vectors: initVectors,
    kinematics: initKinematics,
    projectile: initProjectile,
    newton: initNewton,
    circular: initCircular,
    energy: initEnergy,
    pressure: initPressure,
    thermal_wave: initThermalWave
  };

  return {
    mount(simId, ui) {
      stopCurrent();
      const fn = registry[simId];
      if (fn) fn(ui);
    },
    unmount: stopCurrent
  };
})();

</script>
<script>
/* =====================================================
   PhysLab Interactive — Main Application Controller
   Navigation, Progress Tracking, Puzzles, Quizzes, Formula Sheet
   ===================================================== */

(function () {
  const CHAPTERS = window.PHYSICS_CHAPTERS || [];
  const STORAGE_KEY = 'physlab_interactive_progress_v1';

  const state = {
    view: 'home', // 'home' | 'chapter' | 'puzzles'
    chapterId: null,
    tab: 'lesson', // 'lesson' | 'sim' | 'puzzles' | 'quiz'
    search: '',
    theme: localStorage.getItem('physlab_theme') || 'dark',
    progress: loadProgress()
  };

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { readChapters: {}, solvedPuzzles: {}, quizScores: {} };
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {}
    updateProgressUI();
  }

  // DOM References
  const elSidebar = document.getElementById('sidebar');
  const elOverlay = document.getElementById('sidebar-overlay');
  const elNav = document.getElementById('sidebar-nav');
  const elSearch = document.getElementById('sidebar-search');
  const elMain = document.getElementById('main-container');
  const elProgressBar = document.getElementById('progress-fill');
  const elProgressText = document.getElementById('progress-text');
  const elFormulaModal = document.getElementById('formula-modal');
  const elFormulaBody = document.getElementById('formula-modal-body');

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    localStorage.setItem('physlab_theme', state.theme);
    document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
      btn.textContent = state.theme === 'dark' ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด';
    });
  }

  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  }

  function closeMobileSidebar() {
    elSidebar.classList.remove('open');
    elOverlay.classList.remove('open');
  }

  function updateProgressUI() {
    const totalItems = CHAPTERS.length * 2; // 1 for reading + 1 for quiz per chapter
    let done = 0;
    CHAPTERS.forEach(ch => {
      if (state.progress.readChapters[ch.id]) done += 1;
      if ((state.progress.quizScores[ch.id] || 0) >= Math.ceil(ch.quiz.length / 2)) done += 1;
    });
    const pct = totalItems ? Math.round((done / totalItems) * 100) : 0;
    elProgressBar.style.width = `${pct}%`;
    elProgressText.textContent = `${pct}%`;
    renderSidebar();
  }

  function renderSidebar() {
    const q = state.search.trim().toLowerCase();
    const groups = {};
    CHAPTERS.forEach(ch => {
      const hay = (ch.title + ' ' + ch.subtitle + ' ' + ch.shortTitle + ' ' + ch.formulas.map(f => f.eq + f.desc).join(' ')).toLowerCase();
      if (q && !hay.includes(q)) return;
      if (!groups[ch.group]) groups[ch.group] = [];
      groups[ch.group].push(ch);
    });

    let html = `
      <button class="nav-item ${state.view === 'home' ? 'active' : ''}" data-action="home">
        <span class="nav-num">🏠</span>
        <span class="nav-title">หน้าหลัก (ภาพรวม)</span>
      </button>
      <button class="nav-item ${state.view === 'puzzles' ? 'active' : ''}" data-action="puzzles">
        <span class="nav-num">💡</span>
        <span class="nav-title">คลังปัญหาชวนคิด (24 ข้อ)</span>
      </button>
    `;

    Object.keys(groups).forEach(g => {
      html += `<div class="nav-section-label">${g}</div>`;
      groups[g].forEach(ch => {
        const isActive = state.view === 'chapter' && state.chapterId === ch.id;
        const isDone = state.progress.readChapters[ch.id] && (state.progress.quizScores[ch.id] || 0) >= Math.ceil(ch.quiz.length / 2);
        html += `
          <button class="nav-item ${isActive ? 'active' : ''}" data-ch="${ch.id}">
            <span class="nav-num">${ch.num}</span>
            <span class="nav-title">${ch.shortTitle}</span>
            ${isDone ? '<span class="nav-check">✓</span>' : ''}
          </button>
        `;
      });
    });

    elNav.innerHTML = html;
    elNav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.action;
        const chId = btn.dataset.ch;
        if (act === 'home') navigate('home');
        else if (act === 'puzzles') navigate('puzzles');
        else if (chId) navigate('chapter', chId, 'lesson');
        closeMobileSidebar();
      });
    });
  }

  function navigate(view, chapterId = null, tab = 'lesson') {
    window.PhysicsSimEngine.unmount();
    state.view = view;
    state.chapterId = chapterId;
    state.tab = tab;

    if (view === 'chapter' && chapterId) {
      state.progress.readChapters[chapterId] = true;
      saveProgress();
    } else {
      renderSidebar();
    }

    if (view === 'home') renderHome();
    else if (view === 'puzzles') renderAllPuzzles();
    else if (view === 'chapter') renderChapter(chapterId, tab);

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ================= HOME VIEW ================= */
  function renderHome() {
    const totalPuzzles = CHAPTERS.reduce((s, c) => s + c.puzzles.length, 0);
    const totalQuiz = CHAPTERS.reduce((s, c) => s + c.quiz.length, 0);
    const solvedPuzzles = Object.values(state.progress.solvedPuzzles).filter(Boolean).length;

    elMain.innerHTML = `
      <div class="hero">
        <div class="hero-badge">⚡ Interactive Physics Hub • อ้างอิง Cambridge IGCSE & Classical Physics</div>
        <h1>เรียนฟิสิกส์ให้เห็นภาพ เข้าใจง่าย พร้อมห้องทดลองเคลื่อนไหว</h1>
        <p>สรุปเนื้อหาละเอียดแต่ย่อยง่ายจากตำราฟิสิกส์สากล 2 เล่ม ครบทั้ง <strong>บทเรียนพร้อมตัวอย่างโจทย์ทีละขั้น</strong>, <strong>ห้องทดลอง HTML5 เคลื่อนไหวปรับค่าได้จริง</strong>, <strong>ปัญหาชวนคิดกระตุ้นไอเดีย</strong> และ <strong>แบบฝึกหัดเฉลยละเอียด</strong></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-start">🚀 เริ่มเรียนบทที่ 1</button>
          <button class="btn btn-amber" id="hero-puzzles">💡 ตะลุยปัญหาชวนคิด (${totalPuzzles} ข้อ)</button>
          <button class="btn" id="hero-formulas">📐 เปิดชีตรวมสูตรทั้งหมด</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val">${CHAPTERS.length} บท</div>
          <div class="stat-label">เนื้อหาครบถ้วนพร้อมตัวอย่าง</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">12 โหมด</div>
          <div class="stat-label">ห้องทดลองเคลื่อนไหวโต้ตอบ</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${solvedPuzzles}/${totalPuzzles}</div>
          <div class="stat-label">ปัญหาชวนคิดที่ไขแล้ว</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${totalQuiz} ข้อ</div>
          <div class="stat-label">แบบทดสอบพร้อมเฉลยละเอียด</div>
        </div>
      </div>

      <h2 style="margin-bottom:14px;font-size:21px;">📚 เลือกบทเรียนที่ต้องการศึกษา</h2>
      <div class="chapters-grid">
        ${CHAPTERS.map(ch => {
          const score = state.progress.quizScores[ch.id];
          const scoreBadge = score !== undefined
            ? `<span class="meta-tag" style="color:var(--emerald);border-color:var(--emerald);">Quiz: ${score}/${ch.quiz.length}</span>`
            : `<span class="meta-tag">Quiz ${ch.quiz.length} ข้อ</span>`;
          return `
            <div class="chapter-card" data-open-ch="${ch.id}">
              <div class="chapter-card-top">
                <span class="chapter-pill">บทที่ ${ch.num}</span>
                <span style="font-size:12px;color:var(--text-dim);">${ch.group}</span>
              </div>
              <h3>${ch.title}</h3>
              <p>${ch.subtitle}</p>
              <div class="chapter-meta">
                <span class="meta-tag">🎬 แบบจำลองเคลื่อนไหว</span>
                <span class="meta-tag">💡 ${ch.puzzles.length} ชวนคิด</span>
                ${scoreBadge}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    elMain.querySelector('#hero-start').onclick = () => navigate('chapter', CHAPTERS[0].id, 'lesson');
    elMain.querySelector('#hero-puzzles').onclick = () => navigate('puzzles');
    elMain.querySelector('#hero-formulas').onclick = openFormulaModal;
    elMain.querySelectorAll('[data-open-ch]').forEach(card => {
      card.addEventListener('click', () => navigate('chapter', card.dataset.openCh, 'lesson'));
    });
  }

  /* ================= ALL PUZZLES VIEW ================= */
  function renderAllPuzzles() {
    let cardsHtml = '';
    CHAPTERS.forEach(ch => {
      ch.puzzles.forEach((pz, idx) => {
        cardsHtml += renderPuzzleCardHTML(pz, `บทที่ ${ch.num}: ${ch.shortTitle} • ${pz.tag}`, `${ch.id}_${idx}`);
      });
    });

    elMain.innerHTML = `
      <div class="chapter-header">
        <div class="breadcrumb"><a id="bc-home">หน้าหลัก</a> / คลังปัญหาชวนคิด</div>
        <h1>💡 คลังปัญหาชวนคิดฟิสิกส์ (Think Deeper)</h1>
        <p class="chapter-subtitle">รวม 24 คำถามชวนคิดสุดคลาสสิกจาก Cambridge IGCSE และ Classical Physics — ลองคิดคำตอบในใจก่อนกดเปิดคำใบ้หรือเฉลย!</p>
      </div>
      <div id="puzzles-list">${cardsHtml}</div>
    `;

    elMain.querySelector('#bc-home').onclick = () => navigate('home');
    bindPuzzleEvents(elMain);
  }

  function renderPuzzleCardHTML(pz, badgeText) {
    const solved = !!state.progress.solvedPuzzles[pz.id];
    return `
      <div class="puzzle-card" data-pid="${pz.id}">
        <div class="puzzle-top">
          <span class="puzzle-badge">💡 ${badgeText}</span>
          <button class="btn btn-sm ${solved ? 'btn-emerald' : ''} btn-mark-solved" data-pid="${pz.id}">
            ${solved ? '✅ เข้าใจแล้ว' : '⬜ ติ๊กว่าเข้าใจแล้ว'}
          </button>
        </div>
        <div class="puzzle-q">${pz.question}</div>
        <div class="puzzle-actions">
          <button class="btn btn-sm btn-amber btn-hint">🔍 ดูคำใบ้ (Hint)</button>
          <button class="btn btn-sm btn-primary btn-ans">✨ เปิดเฉลยและคำอธิบาย</button>
        </div>
        <div class="puzzle-reveal hint-box"><strong>🔍 คำใบ้:</strong> ${pz.hint}</div>
        <div class="puzzle-reveal answer-box"><strong>✨ คำอธิบาย:</strong> ${pz.answer}</div>
      </div>
    `;
  }

  function bindPuzzleEvents(container) {
    container.querySelectorAll('.puzzle-card').forEach(card => {
      const pid = card.dataset.pid;
      const hintBox = card.querySelector('.hint-box');
      const ansBox = card.querySelector('.answer-box');
      card.querySelector('.btn-hint').onclick = () => hintBox.classList.toggle('show');
      card.querySelector('.btn-ans').onclick = () => ansBox.classList.toggle('show');
      const solveBtn = card.querySelector('.btn-mark-solved');
      solveBtn.onclick = () => {
        state.progress.solvedPuzzles[pid] = !state.progress.solvedPuzzles[pid];
        const isSolved = state.progress.solvedPuzzles[pid];
        solveBtn.classList.toggle('btn-emerald', isSolved);
        solveBtn.textContent = isSolved ? '✅ เข้าใจแล้ว' : '⬜ ติ๊กว่าเข้าใจแล้ว';
        saveProgress();
      };
    });
  }

  /* ================= CHAPTER VIEW ================= */
  function renderChapter(chapterId, activeTab) {
    const idx = CHAPTERS.findIndex(c => c.id === chapterId);
    const ch = CHAPTERS[idx];
    if (!ch) return renderHome();

    const prevCh = idx > 0 ? CHAPTERS[idx - 1] : null;
    const nextCh = idx < CHAPTERS.length - 1 ? CHAPTERS[idx + 1] : null;

    elMain.innerHTML = `
      <div class="chapter-header">
        <div class="breadcrumb"><a id="bc-home">หน้าหลัก</a> / ${ch.group} / บทที่ ${ch.num}</div>
        <h1>บทที่ ${ch.num}: ${ch.title}</h1>
        <p class="chapter-subtitle">${ch.subtitle}</p>
        <div class="source-badges">
          ${ch.sources.map(s => `<span class="source-badge">📖 อ้างอิง: ${s}</span>`).join('')}
        </div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn ${activeTab === 'lesson' ? 'active' : ''}" data-tab="lesson">📖 เนื้อหาละเอียด</button>
        <button class="tab-btn ${activeTab === 'sim' ? 'active' : ''}" data-tab="sim">🎬 แบบจำลองเคลื่อนไหว</button>
        <button class="tab-btn ${activeTab === 'puzzles' ? 'active' : ''}" data-tab="puzzles">💡 ปัญหาชวนคิด (${ch.puzzles.length})</button>
        <button class="tab-btn ${activeTab === 'quiz' ? 'active' : ''}" data-tab="quiz">📝 แบบฝึกหัด (${ch.quiz.length})</button>
      </div>

      <div id="chapter-tab-body"></div>

      <div class="chapter-nav-footer">
        ${prevCh ? `<button class="btn" id="btn-prev">← บทที่ ${prevCh.num}: ${prevCh.shortTitle}</button>` : '<div></div>'}
        ${nextCh ? `<button class="btn btn-primary" id="btn-next">บทที่ ${nextCh.num}: ${nextCh.shortTitle} →</button>` : `<button class="btn btn-emerald" id="btn-finish">🎉 กลับหน้าหลัก</button>`}
      </div>
    `;

    elMain.querySelector('#bc-home').onclick = () => navigate('home');
    if (prevCh) elMain.querySelector('#btn-prev').onclick = () => navigate('chapter', prevCh.id, 'lesson');
    if (nextCh) elMain.querySelector('#btn-next').onclick = () => navigate('chapter', nextCh.id, 'lesson');
    else elMain.querySelector('#btn-finish').onclick = () => navigate('home');

    elMain.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const nextTab = btn.dataset.tab;
        state.tab = nextTab;
        elMain.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === nextTab));
        renderChapterTabContent(ch, nextTab);
      });
    });

    renderChapterTabContent(ch, activeTab);
  }

  function renderChapterTabContent(ch, tab) {
    window.PhysicsSimEngine.unmount();
    const body = document.getElementById('chapter-tab-body');

    if (tab === 'lesson') {
      body.innerHTML = `
        <div class="intuition-box">
          <strong>🧠 แก่นแนวคิดเข้าใจใน 10 วินาที:</strong><br>${ch.intuition}
        </div>

        <div class="content-section">
          <h2>📐 สูตรสำคัญประจำบท</h2>
          <div class="formula-grid">
            ${ch.formulas.map(f => `
              <div class="formula-card">
                <div class="formula-eq">${f.eq}</div>
                <div class="formula-desc">${f.desc}</div>
              </div>
            `).join('')}
          </div>
        </div>

        ${ch.sections.map(sec => `
          <div class="content-section">
            <h2>${sec.heading}</h2>
            ${sec.html}
          </div>
        `).join('')}

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
          <button class="btn btn-primary" id="jump-sim">🎬 ไปลองเล่นห้องทดลองเคลื่อนไหวบทนี้ →</button>
          <button class="btn btn-amber" id="jump-puz">💡 ลองคิดปัญหาชวนคิดประจำบท →</button>
        </div>
      `;
      body.querySelector('#jump-sim').onclick = () => renderChapter(ch.id, 'sim');
      body.querySelector('#jump-puz').onclick = () => renderChapter(ch.id, 'puzzles');
    }

    else if (tab === 'sim') {
      body.innerHTML = `
        <div class="sim-card">
          <div class="sim-header">
            <h2 style="font-size:19px;">🎬 ${ch.simTitle}</h2>
            <div class="sim-modes" id="sim-modes"></div>
          </div>
          <div class="canvas-wrap">
            <canvas id="sim-canvas"></canvas>
          </div>
          <div class="sim-readouts" id="sim-readouts"></div>
          <div class="sim-controls" id="sim-controls"></div>
          <div class="sim-actions" id="sim-actions"></div>
          <div class="sim-try-box">
            <strong>🧪 ภารกิจทดลองแนะนำ:</strong> ${ch.simGuide}
          </div>
        </div>
      `;
      window.PhysicsSimEngine.mount(ch.simId, {
        canvas: body.querySelector('#sim-canvas'),
        modes: body.querySelector('#sim-modes'),
        readouts: body.querySelector('#sim-readouts'),
        controls: body.querySelector('#sim-controls'),
        actions: body.querySelector('#sim-actions')
      });
    }

    else if (tab === 'puzzles') {
      body.innerHTML = ch.puzzles.map((pz, i) => renderPuzzleCardHTML(pz, `ข้อที่ ${i + 1} • ${pz.tag}`)).join('');
      bindPuzzleEvents(body);
    }

    else if (tab === 'quiz') {
      renderQuiz(body, ch);
    }
  }

  function renderQuiz(body, ch) {
    let answered = 0;
    let correctCount = 0;

    body.innerHTML = `
      <div class="quiz-summary">
        <div>
          <strong style="font-family:var(--font-head);font-size:16px;">📝 แบบทดสอบความเข้าใจ บทที่ ${ch.num}</strong>
          <div style="font-size:13.5px;color:var(--text-muted);" id="quiz-score-lbl">ตอบแล้ว 0 / ${ch.quiz.length} ข้อ • คะแนนสูงสุดเดิม: ${state.progress.quizScores[ch.id] ?? '-'} / ${ch.quiz.length}</div>
        </div>
        <button class="btn btn-sm" id="btn-retry-quiz">🔄 ทำแบบทดสอบใหม่</button>
      </div>
      ${ch.quiz.map((item, qIdx) => `
        <div class="quiz-card" data-qidx="${qIdx}">
          <div class="quiz-q">${qIdx + 1}. ${item.q}</div>
          <div class="quiz-options">
            ${item.options.map((opt, oIdx) => `
              <button class="quiz-opt" data-oidx="${oIdx}">
                <span style="font-family:var(--font-mono);opacity:0.75;">${String.fromCharCode(65 + oIdx)}.</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div class="quiz-explain"><strong>คำอธิบาย:</strong> ${item.explain}</div>
        </div>
      `).join('')}
    `;

    body.querySelector('#btn-retry-quiz').onclick = () => renderQuiz(body, ch);

    body.querySelectorAll('.quiz-card').forEach(card => {
      const qIdx = parseInt(card.dataset.qidx, 10);
      const item = ch.quiz[qIdx];
      const opts = card.querySelectorAll('.quiz-opt');
      const exp = card.querySelector('.quiz-explain');

      opts.forEach(btn => {
        btn.addEventListener('click', () => {
          const picked = parseInt(btn.dataset.oidx, 10);
          opts.forEach(b => b.disabled = true);
          answered++;
          if (picked === item.ans) {
            btn.classList.add('correct');
            correctCount++;
          } else {
            btn.classList.add('wrong');
            opts[item.ans].classList.add('correct');
          }
          exp.classList.add('show');

          const best = Math.max(state.progress.quizScores[ch.id] || 0, correctCount);
          state.progress.quizScores[ch.id] = best;
          saveProgress();
          body.querySelector('#quiz-score-lbl').textContent =
            `ตอบแล้ว ${answered} / ${ch.quiz.length} ข้อ • คะแนนรอบนี้: ${correctCount} / ${ch.quiz.length} (สูงสุด: ${best}/${ch.quiz.length})`;
        });
      });
    });
  }

  /* ================= FORMULA SHEET MODAL ================= */
  function openFormulaModal() {
    elFormulaBody.innerHTML = CHAPTERS.map(ch => `
      <div style="margin-bottom:18px;">
        <h3 style="color:var(--primary);margin-bottom:8px;font-size:16px;">บทที่ ${ch.num}: ${ch.title}</h3>
        <div class="formula-grid">
          ${ch.formulas.map(f => `
            <div class="formula-card">
              <div class="formula-eq">${f.eq}</div>
              <div class="formula-desc">${f.desc}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    elFormulaModal.classList.add('open');
  }

  function closeFormulaModal() {
    elFormulaModal.classList.remove('open');
  }

  /* ================= INIT EVENTS ================= */
  document.getElementById('brand-home').addEventListener('click', () => { navigate('home'); closeMobileSidebar(); });
  document.getElementById('mobile-menu-btn').addEventListener('click', () => {
    elSidebar.classList.toggle('open');
    elOverlay.classList.toggle('open');
  });
  elOverlay.addEventListener('click', closeMobileSidebar);

  document.querySelectorAll('.theme-toggle-btn').forEach(btn => btn.addEventListener('click', toggleTheme));
  document.querySelectorAll('.open-formula-btn').forEach(btn => btn.addEventListener('click', openFormulaModal));
  document.getElementById('close-formula-modal').addEventListener('click', closeFormulaModal);
  elFormulaModal.addEventListener('click', e => { if (e.target === elFormulaModal) closeFormulaModal(); });

  elSearch.addEventListener('input', e => {
    state.search = e.target.value;
    renderSidebar();
  });

  // Boot
  applyTheme();
  updateProgressUI();
  renderHome();
})();

</script>
</body>
</html>
